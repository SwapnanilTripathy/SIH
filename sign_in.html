<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SkillBridge — Sign In</title>
<script>
  (function () {
    var saved = localStorage.getItem('sb-theme');
    if (saved) {
      document.documentElement.setAttribute('data-theme', saved);
    } else {
      var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.setAttribute('data-theme', prefersDark ? 'dark' : 'light');
    }
  })();
</script>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23ffa116'/%3E%3Cg fill='none' stroke='%231a1a1a' stroke-width='4' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M14 40 L14 26 M50 40 L50 26'/%3E%3Cpath d='M14 26 C24 6, 40 6, 50 26'/%3E%3Cline x1='9' y1='40' x2='55' y2='40'/%3E%3Cline x1='24' y1='28' x2='24' y2='40'/%3E%3Cline x1='32' y1='20' x2='32' y2='40'/%3E%3Cline x1='40' y1='28' x2='40' y2='40'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,800&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:      #1a1a1a;
    --panel:   #262626;
    --panel-2: #2d2d2d;
    --border:  #363636;
    --ink:     #eff1f6;
    --muted:   #97979c;
    --brand:   #ffa116;
    --brand-dim: #cc8012;
    --brand-ink: #ffa116;
    --tag-green:  #00b8a3;
    --font-d: 'Fraunces', serif;
    --font-b: 'IBM Plex Sans', sans-serif;
    --font-m: 'IBM Plex Mono', monospace;
    --ease: cubic-bezier(.16,.84,.44,1);
    --ease-pop: cubic-bezier(.34,1.56,.64,1);
    --card-shadow: 0 10px 30px -22px rgba(0,0,0,0.7), inset 0 1px 0 rgba(255,255,255,0.045);
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg:        #f8f6f2;
      --panel:     #ffffff;
      --panel-2:   #f2efe8;
      --border:    #e3ded4;
      --ink:       #1c1a17;
      --muted:     #6b6862;
      --brand:     #ffa116;
      --brand-dim: #cc8012;
      --brand-ink: #b8650a;
      --tag-green: #039083;
      --card-shadow: 0 10px 24px -18px rgba(60,50,30,0.16), inset 0 1px 0 rgba(255,255,255,0.6);
      --nav-bg: rgba(248,246,242,0.85);
      color-scheme: light;
    }
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:        #1a1a1a;
      --panel:     #262626;
      --panel-2:   #2d2d2d;
      --border:    #363636;
      --ink:       #eff1f6;
      --muted:     #97979c;
      --brand:     #ffa116;
      --brand-ink: #ffa116;
      --tag-green: #00b8a3;
      --card-shadow: 0 10px 30px -22px rgba(0,0,0,0.7), inset 0 1px 0 rgba(255,255,255,0.045);
      --nav-bg: rgba(26,26,26,0.85);
      color-scheme: dark;
    }
  }
  [data-theme="light"]{
    --bg:        #f8f6f2;
    --panel:     #ffffff;
    --panel-2:   #f2efe8;
    --border:    #e3ded4;
    --ink:       #1c1a17;
    --muted:     #6b6862;
    --brand-ink: #b8650a;
    --tag-green: #039083;
    --card-shadow: 0 10px 24px -18px rgba(60,50,30,0.16), inset 0 1px 0 rgba(255,255,255,0.6);
    --nav-bg: rgba(248,246,242,0.85);
    color-scheme: light;
  }
  [data-theme="dark"]{
    --bg:        #1a1a1a;
    --panel:     #262626;
    --panel-2:   #2d2d2d;
    --border:    #363636;
    --ink:       #eff1f6;
    --muted:     #97979c;
    --brand-ink: #ffa116;
    --tag-green: #00b8a3;
    --card-shadow: 0 10px 30px -22px rgba(0,0,0,0.7), inset 0 1px 0 rgba(255,255,255,0.045);
    --nav-bg: rgba(26,26,26,0.85);
    color-scheme: dark;
  }

  *,*::before,*::after{ box-sizing:border-box; }
  html{ scroll-behavior:smooth; }
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:var(--font-b); min-height:100vh;
    -webkit-font-smoothing:antialiased;
    transition:background-color .3s var(--ease), color .3s var(--ease);
  }
  a{ color:inherit; text-decoration:none; }
  svg{ display:block; }

  /* glow blobs */
  .glow{ position:fixed; width:580px; height:580px; top:-260px; right:-180px; border-radius:50%;
    background:radial-gradient(circle, rgba(255,161,22,0.11), transparent 70%);
    filter:blur(80px); pointer-events:none; z-index:0; }
  .glow-2{ position:fixed; width:480px; height:480px; bottom:-240px; left:-160px; border-radius:50%;
    background:radial-gradient(circle, rgba(204,128,18,0.08), transparent 70%);
    filter:blur(80px); pointer-events:none; z-index:0; }
  .grain{ position:fixed; inset:0; z-index:1; pointer-events:none; opacity:0.03; mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>"); }

  /* top accent bar */
  .top-accent{ position:fixed; top:0; left:0; right:0; height:3px; z-index:50;
    background:linear-gradient(90deg, transparent, var(--brand), transparent); opacity:0.8; }

  /* nav */
  .nav{
    display:flex; align-items:center; justify-content:space-between;
    padding:16px clamp(20px,5vw,64px);
    position:sticky; top:0; z-index:40;
    background:var(--nav-bg, rgba(26,26,26,0.85));
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--border);
    transition:background .3s var(--ease);
  }
  .logo{ font-family:var(--font-d); font-weight:700; font-size:1.2rem; display:flex; align-items:center; gap:9px; color:var(--ink); }
  .logo .mark{ width:28px; height:28px; border-radius:8px; background:var(--brand);
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 4px 14px -4px rgba(255,161,22,0.5);
    transition:transform .25s var(--ease-pop); }
  .logo:hover .mark{ transform:rotate(-6deg) scale(1.06); }
  .logo .accent{ color:var(--brand); }
  .nav-right{ display:flex; align-items:center; gap:10px; }

  /* theme toggle */
  .theme-btn{
    width:36px; height:36px; border-radius:9px; border:1px solid var(--border);
    background:var(--panel); color:var(--muted); cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition:border-color .2s var(--ease), color .2s var(--ease), background .2s var(--ease);
  }
  .theme-btn:hover{ border-color:var(--brand); color:var(--brand); }
  .theme-btn svg{ width:16px; height:16px; }
  .icon-sun{ display:none; }
  .icon-moon{ display:block; }
  [data-theme="light"] .icon-sun{ display:block; }
  [data-theme="light"] .icon-moon{ display:none; }

  /* back link */
  .back-link{
    font-family:var(--font-m); font-size:0.78rem; color:var(--muted);
    display:inline-flex; align-items:center; gap:6px;
    transition:color .2s var(--ease);
  }
  .back-link:hover{ color:var(--brand); }
  .back-link svg{ width:14px; height:14px; }

  /* page layout */
  .page{ position:relative; z-index:2; min-height:calc(100vh - 61px);
    display:flex; align-items:center; justify-content:center;
    padding:clamp(32px,6vh,72px) clamp(16px,4vw,32px); }

  /* card */
  .auth-card{
    width:100%; max-width:440px;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:20px;
    padding:clamp(28px,4vw,40px) clamp(24px,4vw,36px);
    box-shadow:var(--card-shadow);
    position:relative;
    overflow:hidden;
  }
  .auth-card::before{
    content:""; position:absolute; top:0; left:0; right:0; height:3px;
    background:linear-gradient(90deg, var(--brand), #ffb03d);
    border-radius:20px 20px 0 0;
  }

  /* heading */
  .auth-eyebrow{
    font-family:var(--font-m); font-size:0.7rem; font-weight:600;
    color:var(--brand); text-transform:uppercase; letter-spacing:0.1em;
    margin:0 0 10px;
  }
  .auth-title{
    font-family:var(--font-d); font-weight:700;
    font-size:clamp(1.6rem, 3.5vw, 2rem);
    line-height:1.1; letter-spacing:-0.01em;
    color:var(--ink); margin:0 0 6px;
  }
  .auth-title .accent{ color:var(--brand); }
  .auth-sub{ font-size:0.88rem; color:var(--muted); margin:0 0 28px; line-height:1.5; }

  /* form */
  .form-group{ margin-bottom:18px; }
  .form-label{
    font-family:var(--font-m); font-size:0.72rem; font-weight:500;
    color:var(--muted); text-transform:uppercase; letter-spacing:0.07em;
    display:flex; align-items:center; gap:6px; margin-bottom:8px;
  }
  .form-label svg{ width:12px; height:12px; color:var(--brand); }
  .form-input{
    width:100%; padding:11px 14px;
    background:var(--panel-2); border:1px solid var(--border);
    border-radius:10px; color:var(--ink);
    font-family:var(--font-b); font-size:0.92rem;
    outline:none; transition:border-color .2s var(--ease), box-shadow .2s var(--ease);
  }
  .form-input::placeholder{ color:var(--muted); }
  .form-input:focus{ border-color:var(--brand); box-shadow:0 0 0 3px rgba(255,161,22,0.12); }

  /* password wrapper */
  .pw-wrap{ position:relative; }
  .pw-toggle{
    position:absolute; right:12px; top:50%; transform:translateY(-50%);
    background:none; border:none; color:var(--muted); cursor:pointer; padding:4px;
    transition:color .2s var(--ease);
  }
  .pw-toggle:hover{ color:var(--brand); }
  .pw-toggle svg{ width:15px; height:15px; display:block; }

  /* forgot */
  .forgot-row{ display:flex; justify-content:flex-end; margin-top:-10px; margin-bottom:18px; }
  .forgot-link{ font-size:0.8rem; color:var(--muted); transition:color .2s var(--ease); }
  .forgot-link:hover{ color:var(--brand); }

  /* btn */
  .btn-full{
    width:100%; padding:13px; border-radius:12px; border:none; cursor:pointer;
    font-family:var(--font-b); font-weight:700; font-size:0.95rem;
    display:flex; align-items:center; justify-content:center; gap:8px;
    background:linear-gradient(135deg, #ffb03d, var(--brand) 60%, #f0900a);
    color:#1a1a1a; box-shadow:0 6px 20px -6px rgba(255,161,22,0.55);
    transition:transform .2s var(--ease), box-shadow .2s var(--ease);
  }
  .btn-full:hover{ transform:translateY(-2px); box-shadow:0 10px 28px -6px rgba(255,161,22,0.75); }
  .btn-full:active{ transform:scale(0.98); }
  .btn-full svg{ width:16px; height:16px; }

  /* divider */
  .divider{ display:flex; align-items:center; gap:12px; margin:22px 0; }
  .divider::before,.divider::after{ content:""; flex:1; height:1px; background:var(--border); }
  .divider span{ font-size:0.75rem; color:var(--muted); font-family:var(--font-m); }

  /* social btns */
  .social-row{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:24px; }
  .social-btn{
    padding:10px 14px; border-radius:10px; border:1px solid var(--border);
    background:var(--panel-2); color:var(--ink);
    font-family:var(--font-b); font-size:0.83rem; font-weight:600;
    cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px;
    transition:border-color .2s var(--ease), background .2s var(--ease);
  }
  .social-btn:hover{ border-color:var(--brand); background:var(--panel); }
  .social-btn svg{ width:16px; height:16px; flex-shrink:0; }

  /* bottom link */
  .auth-footer{ text-align:center; font-size:0.85rem; color:var(--muted); margin-top:20px; }
  .auth-footer a{ color:var(--brand); font-weight:600; transition:opacity .2s; }
  .auth-footer a:hover{ opacity:0.8; }

  /* role selector */
  .role-row{ display:flex; gap:8px; margin-bottom:22px; }
  .role-chip{
    flex:1; padding:8px 6px; border-radius:9px; border:1px solid var(--border);
    background:var(--panel-2); color:var(--muted);
    font-family:var(--font-m); font-size:0.72rem; font-weight:500;
    cursor:pointer; text-align:center; letter-spacing:0.04em; text-transform:uppercase;
    transition:border-color .2s var(--ease), color .2s var(--ease), background .2s var(--ease);
    display:flex; align-items:center; justify-content:center; gap:5px;
  }
  .role-chip .dot{ width:6px; height:6px; border-radius:50%; flex-shrink:0; }
  .role-chip.student .dot{ background:#00b8a3; }
  .role-chip.college .dot{ background:#8b5cf6; }
  .role-chip.recruiter .dot{ background:#ff375f; }
  .role-chip:hover{ border-color:var(--brand); color:var(--ink); }
  .role-chip.active.student{ border-color:#00b8a3; color:#00b8a3; background:rgba(0,184,163,0.08); }
  .role-chip.active.college{ border-color:#8b5cf6; color:#8b5cf6; background:rgba(139,92,246,0.08); }
  .role-chip.active.recruiter{ border-color:#ff375f; color:#ff375f; background:rgba(255,55,95,0.08); }

  @media(max-width:480px){
    .social-row{ grid-template-columns:1fr; }
    .role-row{ flex-direction:column; }
  }
</style>
</head>
<body>
<div class="glow"></div>
<div class="glow-2"></div>
<div class="grain"></div>
<div class="top-accent"></div>

<nav class="nav">
  <a href="index.html" class="logo">
    <div class="mark">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1a1a1a" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14 40 L14 26 M50 40 L50 26" transform="scale(0.38) translate(-4,4)"/>
        <path d="M3 18L12 4l9 14"/><line x1="2" y1="18" x2="22" y2="18"/>
        <line x1="7" y1="10" x2="7" y2="18"/><line x1="12" y1="7" x2="12" y2="18"/><line x1="17" y1="10" x2="17" y2="18"/>
      </svg>
    </div>
    Skill <span class="accent">Bridge</span>
  </a>
  <div class="nav-right">
    <a href="index.html" class="back-link">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      Back to home
    </a>
    <button class="theme-btn" id="themeToggle" aria-label="Toggle theme">
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    </button>
  </div>
</nav>

<main class="page">
  <div class="auth-card">
    <p class="auth-eyebrow">// Welcome back</p>
    <h1 class="auth-title">Sign in to <span class="accent">SkillBridge</span></h1>
    <p class="auth-sub">Access your dashboard, matches and opportunities.</p>

    <!-- Role selector -->
    <div class="role-row" id="roleRow">
      <button class="role-chip student active" data-role="student"><span class="dot"></span>Student</button>
      <button class="role-chip college" data-role="college"><span class="dot"></span>College</button>
      <button class="role-chip recruiter" data-role="recruiter"><span class="dot"></span>Recruiter</button>
    </div>

    <!-- Social logins -->
    <div class="social-row">
      <button class="social-btn">
        <svg viewBox="0 0 24 24" fill="none"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
        Google
      </button>
      <button class="social-btn">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 0 1-2.063-2.065 2.064 2.064 0 1 1 2.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>
        LinkedIn
      </button>
    </div>

    <div class="divider"><span>or continue with email</span></div>

    <form id="signinForm" novalidate>
      <div class="form-group">
        <label class="form-label">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
          Email
        </label>
        <input type="email" class="form-input" id="email" placeholder="you@example.com" autocomplete="email" required>
      </div>

      <div class="form-group">
        <label class="form-label">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          Password
        </label>
        <div class="pw-wrap">
          <input type="password" class="form-input" id="password" placeholder="Enter your password" autocomplete="current-password" required>
          <button type="button" class="pw-toggle" id="pwToggle" aria-label="Toggle password">
            <svg id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>

      <div class="forgot-row">
        <a href="#" class="forgot-link">Forgot password?</a>
      </div>

      <button type="submit" class="btn-full">
        Sign In
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>
    </form>

    <p class="auth-footer">Don't have an account? <a href="sign_up.html">Create one →</a></p>
  </div>
</main>

<script>
  // Theme toggle
  var themeToggle = document.getElementById('themeToggle');
  themeToggle.addEventListener('click', function () {
    var current = document.documentElement.getAttribute('data-theme');
    var next = current === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    localStorage.setItem('sb-theme', next);
  });

  // Role chips
  var chips = document.querySelectorAll('.role-chip');
  chips.forEach(function(chip) {
    chip.addEventListener('click', function() {
      chips.forEach(function(c){ c.classList.remove('active'); });
      chip.classList.add('active');
    });
  });

  // Password toggle
  var pwToggle = document.getElementById('pwToggle');
  var pwInput = document.getElementById('password');
  var eyeIcon = document.getElementById('eyeIcon');
  pwToggle.addEventListener('click', function() {
    var isHidden = pwInput.type === 'password';
    pwInput.type = isHidden ? 'text' : 'password';
    eyeIcon.innerHTML = isHidden
      ? '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>'
      : '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';

  // Form submit
  document.getElementById('signinForm').addEventListener('submit', function(e) {
    e.preventDefault();
    var btn = this.querySelector('.btn-full');
    btn.textContent = 'Signing in…';
    btn.style.opacity = '0.8';
    setTimeout(function(){ btn.textContent = 'Sign In'; btn.style.opacity = ''; }, 1800);
  });
</script>
